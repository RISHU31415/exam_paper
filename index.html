<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Papers Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn {
            display: inline-block;
            background-color: #4f46e5;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Exam Papers Archive</h1>
        <p>Click the button below to view and download previous exam papers from the Google Drive folder.</p>
        <a href="https://drive.google.com/drive/folders/1OJX6tD9laleLCX3gwW3RxC2h9ANaP0tN?usp=drive_link" target="_blank" class="btn">Open Exam Papers Folder</a>
    </div>

</body>
</html>
